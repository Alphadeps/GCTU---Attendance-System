services:
  - type: web
    name: class-attendance-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm run build
    startCommand: npm run start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
