# Dependabot: opens pull requests when a package we use has an update.
#
# Kept quiet on purpose: only small (minor/patch) updates, grouped into one PR per folder per week.
# Big version jumps (e.g. 5.x -> 6.x) can change how a package behaves, so they are skipped here
# and done by hand when there is time to test them.
#
# Security fixes are handled by "Dependabot security updates" (repo Settings -> Code security),
# which opens a PR as soon as a vulnerability is published. Note: GitHub applies the `ignore`
# rules below to those security PRs as well, so a fix that only exists in a new major version
# shows up as a Dependabot *alert* (Security tab) instead of a PR - check alerts now and then.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      backend-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]
